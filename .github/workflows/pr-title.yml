name: PR title

# Espejo en CI de .pre-commit-config.yaml: no todo el mundo va a tener
# pre-commit instalado localmente, pero el título del PR sí lo puede validar
# cualquier corredor. Mismo esquema tipo(área): título que usan los tickets.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  lint-pr-title:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            chore
            docs
            refactor
            test
            style
            perf
            ci
          requireScope: false
