# Suite de CORTE -- MDF Trupan 3.0mm
#
# Rango de velocidad/potencia tomado como punto de partida de
# docs/materiales/MDF/Analisis Tecnico MDF - LT-80W-F45.md (200-240 mm/min, 100%,
# 1 pasada). Se abre el rango hacia ambos lados para encontrar el limite real
# de la maquina, no solo confirmar el valor teorico.

material: "MDF Trupan"
espesor_mm: 3.0
operacion: corte

velocidades_mm_min: [150, 180, 200, 220, 240, 260]
potencias_pct: [70, 85, 100]
pasadas: 1
z_step_mm: 0.0

tamano_celda_mm: 15.0
espaciado_mm: 6.0
id_prefijo: "C"
lote: "L01"

# Descomentar y fijar una fecha si se quiere reproducir un lote pasado;
# si se omite, se usa la fecha del dia en que se genera el archivo.
# fecha: "2026-08-28"

machine:
  laser_max_s: 10000       # $30 confirmado en la GRBL de esta maquina (LT-80W-F45)
  travel_feed_mm_min: 3000
