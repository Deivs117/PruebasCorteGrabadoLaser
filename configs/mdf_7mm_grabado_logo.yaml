# Suite de GRABADO -- contorno y relleno del logo de la empresa sobre MDF 7.0mm.
#
# El barrido de velocidad/potencia es el mismo que ya usa
# ejemplo-dev_logo_grabado.yaml (grabado real del logo, ya pensado para esta
# imagen puntual): la tabla de velocidad de corte del LT-80W-F45 no trae un
# dato de grabado ni de potencia, asi que no aplica aca -- grabado corre
# mucho mas rapido y con mucha menos potencia que corte por diseno.
#
# Espesor 7mm elegido para esta corrida especifica (grabado no corta de
# punta a punta, asi que el espesor no limita la velocidad como en corte).

material: "MDF Trupan"
espesor_mm: 7.0
operacion: grabado

velocidades_mm_min: [800, 1000, 1200, 1500]
potencias_pct: [15, 20, 25, 30]
pasadas: 1

tamano_celda_mm: 30.0
espaciado_mm: 8.0
id_prefijo: "G"
lote: "L01"

svg_path: "assets/svg/logo-empresa.svg"
modo_grabado_svg: contorno_y_relleno   # contorno | relleno | contorno_y_relleno
svg_resolucion_relleno_mm: 0.3         # mas fino = mas oscuro y mas lento

machine:
  laser_max_s: 1000
  travel_feed_mm_min: 3000
